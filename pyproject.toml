[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-unknowns-register"
version = "0.1.0"
description = "Deterministic register of unanswered decision questions"
requires-python = ">=3.10"

[project.scripts]
kur = "koml_unknowns_register.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
